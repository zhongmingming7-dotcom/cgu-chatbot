<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CGU AI 客服</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="appShell" class="app-shell">
      <aside id="settingsPanel" class="settings-panel" aria-label="服務資訊">
        <div class="brand">
          <div class="brand-identity">
            <span class="brand-mark" aria-hidden="true">C</span>
            <div>
              <h1>CGU AI 客服</h1>
              <p>校務資訊文字知識庫問答</p>
            </div>
          </div>
          <button id="closeSettingsPanelButton" class="secondary-button compact-button" type="button">關閉資訊</button>
        </div>

        <section class="usage-context" aria-label="服務說明">
          <h2>服務說明</h2>
          <p>問題會送往已設定的客服 API，再依 TXT 知識庫檢索回覆。後端服務須先完成設定。</p>
          <p>此介面不會要求、輸入或儲存 API Key、Token、模型名稱或 Gateway 網址。</p>
        </section>

        <section class="settings-section" aria-labelledby="knowledge-title">
          <h2 id="knowledge-title">可查詢主題</h2>
          <ul class="service-list">
            <li>實體或雲端電腦教室申請</li>
            <li>學生、教職員 M365 Outlook 電子信箱</li>
          </ul>
          <p class="privacy-note">回覆會列出本次檢索到的 TXT 來源；查無資料時會清楚說明。</p>
        </section>

        <section class="clear-records-box" aria-label="清除對話">
          <button id="clearAllRecordsButton" class="danger-button" type="button">清除本機對話</button>
          <p>只會清除此瀏覽器的對話紀錄與草稿，不會影響後端知識庫或任何服務設定。</p>
        </section>
      </aside>

      <section class="chat-panel" aria-label="聊天區">
        <header class="chat-header">
          <div class="chat-title-row">
            <button id="settingsToggleButton" class="secondary-button compact-button" type="button" aria-controls="settingsPanel" aria-expanded="true">隱藏資訊</button>
            <div>
              <h2>聊天</h2>
              <p id="chatHint">可詢問電腦教室或 M365 Outlook 相關服務。</p>
            </div>
          </div>
          <div class="chat-actions">
            <button id="clearChatButton" class="icon-button" type="button" title="清除對話" aria-label="清除對話">清除</button>
          </div>
        </header>

        <div id="messages" class="messages" aria-live="polite"></div>

        <form id="chatForm" class="composer">
          <textarea id="questionInput" rows="2" placeholder="輸入問題，例如：我要申請電腦教室" aria-label="輸入問題"></textarea>
          <button id="sendButton" type="submit">送出</button>
        </form>
      </section>
    </main>

    <script src="runtime-config.js"></script>
    <script src="app.js"></script>
  </body>
</html>
